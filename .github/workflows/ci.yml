name: CI

# Every gate in docs/fellowship-nas-plan.md is run by hand in a VM and takes
# hours. This catches the cheap mistakes first: a broken unit test, a Go file
# that doesn't build, a TypeScript type error, a shell bug. The ISO build needs
# Docker and Debian mirrors, so it stays a local step.

on:
  push:
    # master is the default branch, so it has to be named here: a PR run tests
    # the branch being merged, never the tip master ends up with
    branches: [nas-edition, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest nas/tests/unit/test_fnas.py
      - name: Byte-compile every module
        run: python3 -m compileall -q nas/packages/fellowship-nas-tools/fellowship_nas
      # Errors only to start with, like ShellCheck: a name used before it is
      # defined, an import that isn't there, an f-string with no placeholders.
      # Widen the selection once the package is quiet.
      - name: Lint
        run: |
          pip install --quiet ruff
          ruff check --select E9,F nas/packages/fellowship-nas-tools nas/tests/unit/test_fnas.py

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - installer
          - nas/packages/fellowship-nas-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          # Neither module has dependencies yet, so there is no go.sum to key a
          # cache on, and asking for one only logs a restore failure
          cache: false
      # The web helper links libpam through cgo
      - name: PAM development headers
        run: sudo apt-get update -qq && sudo apt-get install -y libpam0g-dev
      - name: Formatting
        working-directory: ${{ matrix.module }}
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet and test
        working-directory: ${{ matrix.module }}
        env:
          CGO_ENABLED: "1"
        run: |
          go vet ./...
          # The helper and the daemon share state between requests, so the
          # race detector is part of the test, and coverage shows what a new
          # file op still needs
          go test -race -cover ./...

  web:
    name: Desktop build (${{ matrix.folder }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        folder:
          - nas/packages/fellowship-nas-web/web
          - installer/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.folder }}
        run: npm ci
      # Type-checks with tsc --noEmit, then bundles with esbuild
      - name: Type check and bundle
        working-directory: ${{ matrix.folder }}
        run: npm run build

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      # Errors only to start with, so the first runs are about real bugs.
      # Tighten to --severity=warning once the scripts are quiet.
      - name: ShellCheck
        # Plus the hook and maintainer scripts, which carry no .sh
        run: >-
          shellcheck --severity=error $(git ls-files '*.sh')
          nas/packages/fellowship-nas-tools/md-alert nas/packages/fellowship-nas-tools/fellowship-nas-notify
          nas/packages/fellowship-nas/smart-alert nas/packages/fellowship-nas/zfs-kernel-check
          $(git ls-files 'nas/packages/*/debian/postinst' 'nas/packages/*/debian/postrm')
