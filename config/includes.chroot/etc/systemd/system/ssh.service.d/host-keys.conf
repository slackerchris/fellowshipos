# The image ships without SSH host keys, so that no two machines share them.
# Make any that are missing before sshd's own check, so an installed system's
# first start has its own keys instead of a failed ssh.service.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
