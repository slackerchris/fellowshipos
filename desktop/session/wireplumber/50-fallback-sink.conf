# Enable WirePlumber's fallback sink for machines with no sound hardware.

# PipeWire ships the script `fallback-sink.lua` but does not load it by
# default. With no physical sink — a QEMU guest with no sound device, or a
# machine whose audio driver has not come up — there is then no default sink
# at all, so the volume keys and the top bar have nothing to act on and media
# apps have nowhere to link. This loads that script as a policy component and
# asks the main profile for it: it creates a "Dummy Output" sink when no real
# one exists and removes it the moment a real sink appears, so a machine with
# working audio is unaffected.

wireplumber.components = [
  { name = fallback-sink.lua, type = script/lua, provides = policy.fallbacksink }
]

wireplumber.profiles = {
  main = { policy.fallbacksink = required }
}
