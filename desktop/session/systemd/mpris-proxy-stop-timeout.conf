# BlueZ's mpris-proxy (Bluetooth headphones' play/pause buttons) often ignores
# SIGTERM while a session is ending, and systemd would wait its default 90 s
# before killing it. The user manager can't finish stopping until it does, and
# logging in again during that wait hangs at the login screen until it ends
# (seen on the Dell, 2026-11-22: password accepted, desktop not started, Chris
# rebooted). 15 s, as Chris chose; a kill is recorded at the next login in
# ~/.local/state/fellowship/service-timeouts.log (fellowship-session).
[Service]
TimeoutStopSec=15s
