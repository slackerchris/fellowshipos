# FellowshipOS desktop: the kernel's text console on tty1-6 only.
#
# The login screen and the desktop run on tty7. With no text console there,
# nothing is drawn behind them during the hand-off from the login screen to
# the desktop, so logging in goes from the login screen's fade to the desktop
# without a frame of console text (DESK-016). Ctrl+Alt+F1..F6 keep their text
# consoles, and boot messages and the emergency shell stay on tty1.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT fbcon=vc:1-6"
