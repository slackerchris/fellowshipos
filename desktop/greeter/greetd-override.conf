[Unit]
ConditionKernelCommandLine=!fellowship.installer
# greetd runs on tty7 (its own config), which Debian's unit already keeps
# free of a getty; tty1 keeps its text login.
After=accounts-daemon.service dbus.service
StartLimitBurst=5
StartLimitIntervalSec=30

[Service]
ExecStart=
ExecStart=/usr/libexec/fellowship-greetd-launch
Restart=always
RestartSec=2
