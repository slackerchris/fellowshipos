[terminal]
# tty7, which has no kernel text console (fbcon=vc:1-6): the login screen
# hands over to the desktop without console text showing in between
# (DESK-016). tty1 keeps its text login for recovery.
vt = 7

# Live ISO ("Try FellowshipOS") enters the live desktop automatically;
# logging out returns to fellowship-greeter.
[initial_session]
command = "/usr/bin/fellowship-session"
user = "user"

[default_session]
command = "/usr/libexec/fellowship-greeter-session"
user = "_greetd"
